<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.5, user-scalable=yes">
  <title>See Me · wellness companion</title>
  <!-- Web Speech API is built into modern browsers – no external dependencies -->
  <style>
    /* reset & base */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: #0b0d15; /* deep near-black with a hint of blue */
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
      padding: 16px;
    }

    .app-container {
      max-width: 560px;
      width: 100%;
      background: #12141e;
      border-radius: 48px;
      padding: 32px 24px 40px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.8), 0 0 0 1px rgba(255,215,0,0.15);
      transition: background 0.2s;
    }

    /* TITLE – high contrast white */
    .app-title {
      text-align: center;
      color: white;
      font-size: 2.6rem;
      font-weight: 600;
      letter-spacing: 0.06em;
      margin-bottom: 28px;
      text-shadow: 0 4px 12px rgba(0,0,0,0.6);
      word-break: break-word;
    }
    .app-title span {
      background: linear-gradient(145deg, #ffd966, #f7c948);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      text-shadow: 0 0 12px rgba(255,215,0,0.3);
    }

    /* BUTTON GRID – stacked vertically with generous spacing */
    .button-group {
      display: flex;
      flex-direction: column;
      gap: 20px;
      margin-bottom: 24px;
    }

    .main-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      width: 100%;
      min-height: 110px;          /* well over 100px */
      padding: 16px 20px;
      background: #1e2335;
      border: none;
      border-radius: 60px;
      font-size: 1.9rem;
      font-weight: 600;
      color: #f5f0e8;
      text-shadow: 0 2px 4px rgba(0,0,0,0.4);
      box-shadow: 0 8px 0 #0a0c14, 0 12px 28px rgba(0,0,0,0.7);
      transition: all 0.08s linear;
      cursor: pointer;
      touch-action: manipulation;
      /* high contrast outline for keyboard / focus */
      outline: 3px solid transparent;
      outline-offset: 2px;
    }

    /* focus-visible for keyboard users */
    .main-btn:focus-visible {
      outline: 4px solid #ffd966;
      outline-offset: 4px;
    }

    /* active / press feedback */
    .main-btn:active {
      transform: translateY(6px);
      box-shadow: 0 2px 0 #0a0c14, 0 8px 20px rgba(0,0,0,0.8);
    }

    /* individual button colours – high contrast against dark background */
    .btn-listen {
      background: #1f3a5f;
      color: #fff9e6;
    }
    .btn-listen:active {
      background: #2a4b78;
    }

    .btn-checkin {
      background: #3e2c4b;
      color: #f7eed7;
    }
    .btn-checkin:active {
      background: #543b64;
    }

    .btn-reminders {
      background: #2a4a3e;
      color: #f2f0e0;
    }
    .btn-reminders:active {
      background: #376454;
    }

    .btn-call {
      background: #4a2e3a;
      color: #fae9e6;
    }
    .btn-call:active {
      background: #663d4d;
    }

    /* emoji + text alignment */
    .btn-emoji {
      font-size: 2.4rem;
      line-height: 1;
      filter: drop-shadow(0 2px 4px rgba(0,0,0,0.3));
    }
    .btn-label {
      letter-spacing: 0.02em;
      font-size: 1.8rem;
    }

    /* ----- MOOD TRACKING (check-in modal) ----- */
    .mood-overlay {
      display: none;  /* hidden by default */
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.75);
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
      justify-content: center;
      align-items: center;
      z-index: 1000;
      padding: 20px;
    }

    .mood-overlay.active {
      display: flex;
    }

    .mood-card {
      background: #1c1f2b;
      border-radius: 72px;
      padding: 40px 28px 36px;
      max-width: 440px;
      width: 100%;
      box-shadow: 0 30px 60px rgba(0,0,0,0.9);
      border: 1px solid rgba(255,215,0,0.2);
      text-align: center;
    }

    .mood-question {
      color: #fff4e0;
      font-size: 2.0rem;
      font-weight: 500;
      margin-bottom: 28px;
      letter-spacing: 0.02em;
    }

    .mood-options {
      display: flex;
      justify-content: space-around;
      gap: 12px;
      flex-wrap: wrap;
      margin-bottom: 16px;
    }

    .mood-btn {
      background: #2c3145;
      border: none;
      border-radius: 80px;
      padding: 16px 20px;
      min-width: 90px;
      font-size: 3.0rem;
      line-height: 1;
      cursor: pointer;
      box-shadow: 0 6px 0 #0f111a;
      transition: all 0.06s linear;
      touch-action: manipulation;
      color: white;
      outline: 3px solid transparent;
      outline-offset: 2px;
    }
    .mood-btn:focus-visible {
      outline: 4px solid #ffd966;
      outline-offset: 4px;
    }
    .mood-btn:active {
      transform: translateY(5px);
      box-shadow: 0 1px 0 #0f111a;
    }

    .mood-close-btn {
      background: transparent;
      border: 2px solid #7a7f94;
      color: #cdd2e6;
      font-size: 1.2rem;
      padding: 12px 28px;
      border-radius: 60px;
      margin-top: 16px;
      cursor: pointer;
      font-weight: 500;
      transition: 0.15s;
      touch-action: manipulation;
    }
    .mood-close-btn:hover,
    .mood-close-btn:focus-visible {
      background: #2f3449;
      border-color: #bcc2db;
      color: white;
    }

    .mood-feedback {
      margin-top: 16px;
      font-size: 1.6rem;
      color: #ffd966;
      min-height: 3.0rem;
      font-weight: 400;
    }

    /* ----- CALL A FRIEND SIMULATION (lightweight) ----- */
    .call-sim {
      margin-top: 16px;
      padding: 14px 18px;
      background: #22273b;
      border-radius: 60px;
      color: #e8e2d0;
      font-size: 1.2rem;
      border-left: 4px solid #ffb07c;
      display: none;  /* hidden by default, shown via js */
    }
    .call-sim.visible {
      display: block;
    }

    /* responsive fine-tune */
    @media (max-width: 480px) {
      .app-container {
        padding: 20px 14px 28px;
        border-radius: 32px;
      }
      .app-title {
        font-size: 2.2rem;
      }
      .main-btn {
        min-height: 100px;
        font-size: 1.6rem;
        border-radius: 40px;
        gap: 10px;
        padding: 12px 16px;
      }
      .btn-emoji {
        font-size: 2.0rem;
      }
      .btn-label {
        font-size: 1.5rem;
      }
      .mood-question {
        font-size: 1.7rem;
      }
      .mood-btn {
        min-width: 70px;
        padding: 12px 14px;
        font-size: 2.4rem;
      }
    }

    /* accessibility: reduce motion if user prefers */
    @media (prefers-reduced-motion: reduce) {
      * {
        transition-duration: 0.01ms !important;
      }
    }

    /* high contrast mode support */
    @media (prefers-contrast: high) {
      .main-btn {
        border: 3px solid white;
      }
      .mood-btn {
        border: 2px solid white;
      }
    }
  </style>
</head>
<body>

<div class="app-container" role="main" aria-label="See Me wellness app">

  <h1 class="app-title" aria-label="See Me">
    <span>SEE</span> ME
  </h1>

  <div class="button-group" role="group" aria-label="Main actions">

    <!-- LISTEN -->
    <button class="main-btn btn-listen" 
            id="btnListen" 
            aria-label="Listen to calming sounds and stories"
            tabindex="0">
      <span class="btn-emoji" aria-hidden="true">🎧</span>
      <span class="btn-label">Listen</span>
    </button>

    <!-- CHECK-IN -->
    <button class="main-btn btn-checkin" 
            id="btnCheckin" 
            aria-label="Check in with your mood"
            tabindex="0">
      <span class="btn-emoji" aria-hidden="true">😊</span>
      <span class="btn-label">Check‑in</span>
    </button>

    <!-- REMINDERS -->
    <button class="main-btn btn-reminders" 
            id="btnReminders" 
            aria-label="Get a daily reminder"
            tabindex="0">
      <span class="btn-emoji" aria-hidden="true">⏰</span>
      <span class="btn-label">Reminders</span>
    </button>

    <!-- CALL A FRIEND -->
    <button class="main-btn btn-call" 
            id="btnCall" 
            aria-label="Call a friend or family member"
            tabindex="0">
      <span class="btn-emoji" aria-hidden="true">📞</span>
      <span class="btn-label">Call a Friend</span>
    </button>
  </div>

  <!-- subtle call simulation status (appears after tapping Call) -->
  <div id="callSim" class="call-sim" role="status" aria-live="polite">
    📞 <span id="callMessage">Calling your pre-set contact …</span>
  </div>
</div>

<!-- ========== MOOD OVERLAY (modal) ========== -->
<div id="moodOverlay" class="mood-overlay" role="dialog" aria-modal="true" aria-labelledby="moodHeading">
  <div class="mood-card">
    <div id="moodHeading" class="mood-question" aria-live="assertive">
      How are you feeling today?
    </div>
    <div class="mood-options" role="group" aria-label="Mood options">
      <button class="mood-btn" data-mood="happy" aria-label="Happy" tabindex="0">😊</button>
      <button class="mood-btn" data-mood="okay" aria-label="Okay" tabindex="0">😐</button>
      <button class="mood-btn" data-mood="sad" aria-label="Sad" tabindex="0">😢</button>
    </div>
    <div id="moodFeedback" class="mood-feedback" aria-live="polite"></div>
    <button class="mood-close-btn" id="closeMoodBtn" aria-label="Close mood check-in">Close</button>
  </div>
</div>

<script>
  (function() {
    "use strict";

    // ---------- DOM refs ----------
    const listenBtn = document.getElementById('btnListen');
    const checkinBtn = document.getElementById('btnCheckin');
    const remindersBtn = document.getElementById('btnReminders');
    const callBtn = document.getElementById('btnCall');
    const moodOverlay = document.getElementById('moodOverlay');
    const moodFeedback = document.getElementById('moodFeedback');
    const closeMoodBtn = document.getElementById('closeMoodBtn');
    const callSim = document.getElementById('callSim');
    const callMessage = document.getElementById('callMessage');

    // ---------- SPEECH (Web Speech API) ----------
    function speakText(text, rate = 0.95, pitch = 1.0) {
      if (!window.speechSynthesis) {
        console.warn('Web Speech API not supported');
        return;
      }
      // Cancel any ongoing speech to avoid overlap
      window.speechSynthesis.cancel();

      const utterance = new SpeechSynthesisUtterance(text);
      utterance.rate = rate;
      utterance.pitch = pitch;
      utterance.volume = 1;
      // pick a voice if available (optional: prefer female voice)
      const voices = window.speechSynthesis.getVoices();
      if (voices.length) {
        // try to find a clear, natural voice (often 'Google UK' or 'Samantha')
        const preferred = voices.find(v => /samantha|google|female|zira/i.test(v.name));
        if (preferred) utterance.voice = preferred;
      }
      window.speechSynthesis.speak(utterance);
    }

    // preload voices (they load asynchronously)
    if (window.speechSynthesis) {
      window.speechSynthesis.getVoices();
      window.speechSynthesis.onvoiceschanged = () => {
        window.speechSynthesis.getVoices();
      };
    }

    // ---------- AUDIO (nature sounds) ----------
    // using public domain / free sounds from freesound / pixabay via inline base64 or URL.
    // For reliability we use short, royalty-free audio from a CDN (samples).
    // If network fails, we fallback to speech only – no big deal.
    const audioTracks = [
      'https://cdn.pixabay.com/download/audio/2022/03/10/audio_c8c8f7c8c8.mp3?filename=waves-10475.mp3',   // ocean waves
      'https://cdn.pixabay.com/download/audio/2022/03/10/audio_3c8a7b1c8a.mp3?filename=rain-103583.mp3',    // rain
      'https://cdn.pixabay.com/download/audio/2022/03/10/audio_2c8a7b1c8a.mp3?filename=forest-birds-10476.mp3' // forest birds
    ];
    let currentAudio = null;

    function playRandomNatureSound() {
      // stop any currently playing audio
      if (currentAudio) {
        currentAudio.pause();
        currentAudio.currentTime = 0;
        currentAudio = null;
      }

      const randomIndex = Math.floor(Math.random() * audioTracks.length);
      const url = audioTracks[randomIndex];
      const audio = new Audio(url);
      audio.volume = 0.7;
      audio.loop = false;
      audio.play().catch(err => {
        // if autoplay blocked or network error, just speak a message
        console.warn('Audio play failed:', err);
        speakText('Could not play sound right now, but I am here with you.', 0.9);
      });
      currentAudio = audio;
      // clean up after end
      audio.onended = () => {
        currentAudio = null;
      };
    }

    // ---------- REMINDERS ----------
    const remindersList = [
      'Stretch your arms and take a deep breath.',
      'Drink a glass of water — you deserve it.',
      'Call someone you love, just to say hello.',
      'Take three slow, calming breaths.',
      'Stand up and walk for one minute. You’ve got this.'
    ];
    let reminderIndex = 0;

    function getNextReminder() {
      const reminder = remindersList[reminderIndex % remindersList.length];
      reminderIndex++;
      return reminder;
    }

    // ---------- CALL A FRIEND (simulation) ----------
    function simulateCall() {
      // show the simulation banner
      callSim.classList.add('visible');
      const contactName = 'your family member or senior center';
      callMessage.textContent = `📞 Calling ${contactName} … (simulated)`;
      speakText(`Calling ${contactName}. In a real app, this would connect you right now.`, 0.9);
      // auto-hide after 8 seconds
      clearTimeout(window.callSimTimeout);
      window.callSimTimeout = setTimeout(() => {
        callSim.classList.remove('visible');
      }, 8000);
    }

    // ---------- MOOD TRACKING ----------
    function openMoodCheckin() {
      moodFeedback.textContent = '';
      // reset any previous spoken feedback
      moodOverlay.classList.add('active');
      // focus first mood button for accessibility
      const firstMood = document.querySelector('.mood-btn');
      if (firstMood) {
        setTimeout(() => firstMood.focus(), 50);
      }
      // speak the question
      speakText('How are you feeling today? Tap happy, okay, or sad.', 0.9);
    }

    function closeMoodCheckin() {
      moodOverlay.classList.remove('active');
      // return focus to check-in button
      checkinBtn.focus();
      // cancel speech if any
      if (window.speechSynthesis) window.speechSynthesis.cancel();
    }

    // handle mood selection
    function handleMoodSelection(mood) {
      let message = '';
      let emoji = '';
      if (mood === 'happy') {
        message = 'You said happy. That is wonderful!';
        emoji = '😊';
      } else if (mood === 'okay') {
        message = 'You said okay. That is perfectly fine — we all have days like that.';
        emoji = '😐';
      } else if (mood === 'sad') {
        message = 'You said sad. I am sorry you are feeling that way. It is brave to share.';
        emoji = '😢';
      } else {
        return;
      }
      moodFeedback.textContent = `${emoji} ${message}`;
      speakText(message, 0.9, 1.0);
      // auto-close after 4 seconds (gives time to read / hear)
      clearTimeout(window.moodCloseTimer);
      window.moodCloseTimer = setTimeout(() => {
        closeMoodCheckin();
      }, 4500);
    }

    // ---------- EVENT BINDING ----------
    // 1) LISTEN
    listenBtn.addEventListener('click', function(e) {
      speakText('Listen. Playing calming sounds for you.', 0.9);
      playRandomNatureSound();
      // provide haptic-like feedback via speech
    });

    // 2) CHECK-IN
    checkinBtn.addEventListener('click', function(e) {
      // speak the button name, then open modal
      speakText('Check in. How are you feeling?', 0.9);
      openMoodCheckin();
    });

    // 3) REMINDERS
    remindersBtn.addEventListener('click', function(e) {
      const reminder = getNextReminder();
      speakText(`Reminder: ${reminder}`, 0.9);
      // also show a subtle announcement (optional)
      // we can also use aria-live, but speech is enough
    });

    // 4) CALL A FRIEND
    callBtn.addEventListener('click', function(e) {
      speakText('Call a friend. Connecting you now.', 0.9);
      simulateCall();
    });

    // ----- MOOD overlay events -----
    document.querySelectorAll('.mood-btn').forEach(btn => {
      btn.addEventListener('click', function(e) {
        const mood = this.getAttribute('data-mood');
        if (mood) {
          handleMoodSelection(mood);
        }
      });
      // keyboard support (Enter / Space)
      btn.addEventListener('keydown', function(e) {
        if (e.key === 'Enter' || e.key === ' ') {
          e.preventDefault();
          this.click();
        }
      });
    });

    // close mood overlay
    closeMoodBtn.addEventListener('click', function() {
      closeMoodCheckin();
    });

    // close on backdrop click (click on overlay itself)
    moodOverlay.addEventListener('click', function(e) {
      if (e.target === moodOverlay) {
        closeMoodCheckin();
      }
    });

    // keyboard: Escape to close mood
    document.addEventListener('keydown', function(e) {
      if (e.key === 'Escape' && moodOverlay.classList.contains('active')) {
        closeMoodCheckin();
        e.preventDefault();
      }
    });

    // ----- ARIA & accessibility: ensure buttons are keyboard accessible (already) -----
    // also, add aria-live regions for dynamic content (already in place)

    // pre-warm speech voices on first user interaction (optional)
    function warmupSpeech() {
      if (window.speechSynthesis) {
        window.speechSynthesis.getVoices();
      }
    }
    document.addEventListener('click', warmupSpeech, { once: true });
    document.addEventListener('touchstart', warmupSpeech, { once: true });

    // additional: when mood overlay opens, trap focus? 
    // we handle it with focus management inside openMoodCheckin.

    console.log('See Me app ready – accessible, audio, mood tracking.');
  })();
</script>

</body>
</html>
